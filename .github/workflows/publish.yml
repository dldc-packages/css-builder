name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for the npm OIDC trusted-publishing exchange
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          # Node + pnpm resolve from package.json devEngines (no .node-version file).
          cache: false # npm guidance: never cache in release builds
          # No registry-url: setup-vp writes `_authToken=${NODE_AUTH_TOKEN}` to
          # .npmrc; with no secret set it expands to an empty token and stops the
          # npm CLI from starting the OIDC exchange (ENEEDAUTH).
      - run: vp check
      - run: vp test run
      - run: vp pack
      - run: npm publish --access public
